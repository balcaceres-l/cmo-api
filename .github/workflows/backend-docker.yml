name: Backend Docker (Docker Hub)

on:
  push:
    branches:
      - development
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Backend to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticación en Docker Hub
        if: ${{ env.DOCKERHUB_USER != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Compilar y publicar imagen Docker del Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ env.DOCKERHUB_USER != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cmo-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cmo-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
