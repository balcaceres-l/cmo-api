name: Web Docker CI

on:
  push:
    branches:
      - development
      - main
    paths:
      - 'web/**'
      - '.github/workflows/web-docker.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'web/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Web Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar imagen Docker (Test de Build y Cache)
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: hospital-cmo-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
