name: Web Docker (Docker Hub)

on:
  push:
    branches:
      - development
      - main
      - 'web-*'
    paths:
      - 'web/**'
      - '.github/workflows/web-docker.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL de la API (Opcional, si se deja vacío usa el Secret API_BASE_URL)'
        required: false
        default: ''

jobs:
  build-and-push:
    name: Build & Push Web to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticación en Docker Hub
        if: ${{ env.DOCKERHUB_USER != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Determinar URL de la API
        id: config
        run: |
          API_URL="${{ github.event.inputs.api_url }}"
          if [ -z "$API_URL" ]; then
            API_URL="${{ secrets.API_BASE_URL }}"
          fi
          if [ -z "$API_URL" ]; then
            API_URL="http://localhost:8000/api/v1"
          fi
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT

      - name: Compilar y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: ${{ env.DOCKERHUB_USER != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cmo-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cmo-web:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ steps.config.outputs.api_url }}
            VITE_REVERB_HOST=${{ secrets.REVERB_HOST || 'localhost' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
