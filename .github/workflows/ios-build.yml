name: iOS Build (Manual)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      api_url:
        description: 'URL de la API (Opcional, si se deja vacío usa el Secret API_BASE_URL)'
        required: false
        default: ''

jobs:
  build:
    name: Build iOS Project
    runs-on: macos-15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar versión de Xcode (Xcode 16+)
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Seleccionando $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Inyectar URL de la API en Config.xcconfig
        run: |
          cd ios
          API_URL="${{ github.event.inputs.api_url }}"
          if [ -z "$API_URL" ]; then
            API_URL="${{ secrets.API_BASE_URL }}"
          fi
          if [ -z "$API_URL" ]; then
            API_URL="http://localhost:8000/api/v1"
          fi

          # Eliminar slash final si viene incluido para consistencia en xcconfig
          API_URL="${API_URL%/}"

          # En xcconfig, las dos barras // se escapan como /$()/ para que Xcode no las confunda con un comentario
          FORMATTED_URL=$(echo "$API_URL" | sed 's|://|:/$()/|g')

          echo "Configurando API_BASE_URL = ${FORMATTED_URL}"
          echo "// Configuración generada por GitHub Actions" > Config.xcconfig
          echo "API_BASE_URL = ${FORMATTED_URL}" >> Config.xcconfig
          echo "REVERB_APP_KEY = ${{ secrets.REVERB_APP_KEY || 'hospital-key' }}" >> Config.xcconfig
          echo "REVERB_HOST = ${{ secrets.REVERB_HOST || 'localhost' }}" >> Config.xcconfig
          echo "REVERB_PORT = ${{ secrets.REVERB_PORT || '8080' }}" >> Config.xcconfig

      - name: Compilar proyecto Xcode
        run: |
          cd ios
          PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          if [ -n "$PROJ" ]; then
            echo "Proyecto encontrado: $PROJ"
            SCHEME=$(xcodebuild -project "$PROJ" -list | awk '/Schemes:/{flag=1; next} flag && NF {print $1; exit}')
            if [ -z "$SCHEME" ]; then
              SCHEME="appcmo"
            fi
            echo "Compilando con scheme: $SCHEME"

            BUILD_CONFIG="Debug"
            if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
              BUILD_CONFIG="Release"
            fi

            xcodebuild -project "$PROJ" \
              -scheme "$SCHEME" \
              -configuration "$BUILD_CONFIG" \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              clean build
          else
            echo "Error: No se encontró archivo .xcodeproj en ios/."
            exit 1
          fi

      - name: Empaquetar a .ipa
        run: |
          cd ios
          APP_PATH=$(find build -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No se encontró el bundle .app compilado."
            exit 1
          fi
          echo "Empaquetando $APP_PATH a .ipa..."
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="appcmo-${{ github.event.inputs.build_type || 'debug' }}.ipa"
          zip -rq "$IPA_NAME" Payload
          rm -rf Payload
          echo "Archivo $IPA_NAME generado exitosamente."

      - name: Subir artefacto .ipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: appcmo-${{ github.event.inputs.build_type || 'debug' }}.ipa
          path: ios/*.ipa
          if-no-files-found: error
