name: Android APK Build (Manual)

on:
  push:
    branches:
      - 'android-*'
      - development
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      api_url:
        description: 'URL de la API (Opcional, si se deja vacío usa el Secret API_BASE_URL)'
        required: false
        default: ''

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inyectar URL de la API en local.properties
        run: |
          cd android
          API_URL="${{ github.event.inputs.api_url }}"
          if [ -z "$API_URL" ]; then
            API_URL="${{ secrets.API_BASE_URL }}"
          fi
          if [ -z "$API_URL" ]; then
            API_URL="https://cmo-api.marioalabi.com/api/v1/"
          fi

          # Asegurar que termine en slash /
          [[ "${API_URL}" != */ ]] && API_URL="${API_URL}/"

          echo "Configurando api.baseUrl=${API_URL}"
          echo "api.baseUrl=${API_URL}" > local.properties
          echo "reverb.appKey=${{ secrets.REVERB_APP_KEY || 'hospital-key' }}" >> local.properties
          echo "reverb.host=${{ secrets.REVERB_HOST || '10.0.2.2' }}" >> local.properties
          echo "reverb.port=${{ secrets.REVERB_PORT || '8080' }}" >> local.properties

      - name: Compilar APK con Gradle
        run: |
          cd android
          if [ -f gradlew ]; then
            chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
              ./gradlew assembleRelease --no-daemon
            else
              ./gradlew assembleDebug --no-daemon
            fi
          else
            echo "Aviso: No se encontró gradlew en android/. Inicializa el proyecto con Android Studio para generar el wrapper."
          fi

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-${{ github.event.inputs.build_type }}.apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
