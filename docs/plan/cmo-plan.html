r y leen la URL base de local.properties.", "Una capa común convierte la respuesta de la API (success, message, errors) en un resultado con mensajes de error legibles.", "La navegación tiene una pantalla de inicio vacía por rol (recepción y médico)."], "api": "—", "fig": "Figma 4:655 · 4:2", "dep": ["FUN-OPS-2", "FUN-OPS-3"], "ref": []}, {"id": "FUN-IOS-1", "num": "HU-7", "ep": "FUN", "pl": "IOS", "h": "S2", "m": 1, "p": "Alta", "pts": 5, "t": "Proyecto Xcode base (SwiftUI, MVVM)", "q": "Como equipo iOS quiero un proyecto base con la arquitectura definida para que todas las pantallas se construyan igual.", "ac": ["El proyecto está en ios/, usa SwiftUI y compila y corre en el simulador (requiere una Mac).", "Hay capas View, ViewModel, Repository y un cliente de red con async/await.", "El token se guarda en Keychain y la URL base sale de un archivo .xcconfig.", "Una capa común traduce la respuesta de la API (success, message, errors) a errores con texto legible.", "La navegación tiene una pantalla de inicio vacía para médico y otra para paciente.", "Los archivos personales de Xcode (xcuserdata, DerivedData) están en .gitignore y el proyecto vive solo en ios/, sin tocar otras carpetas."], "api": "—", "fig": "Figma 8:2 · 8:100", "dep": ["FUN-OPS-2", "FUN-OPS-3"], "ref": []}, {"id": "FUN-WEB-1", "num": "HU-8", "ep": "FUN", "pl": "WEB", "h": "S2", "m": 1, "p": "Alta", "pts": 3, "t": "Proyecto web base (React + Vite)", "q": "Como equipo web quiero un proyecto base del panel para empezar a construir módulos sobre la misma estructura.", "ac": ["El proyecto está en web/, corre con npm run dev en el puerto 5173 (el que la API ya permite por CORS).", "Tiene enrutador, cliente HTTP con el token Bearer y la URL base desde VITE_API_URL.", "Una capa común muestra los mensajes de error de la API (422 por campo, 403, 409).", "Hay un layout vacío con barra lateral y encabezado."], "api": "—", "fig": "Figma 10:2", "dep": ["FUN-OPS-2", "FUN-OPS-3"], "ref": []}, {"id": "DOC-DOC-1", "num": "HU-88", "ep": "DOC", "pl": "DOC", "h": "S2", "m": 1, "p": "Alta", "pts": 3, "t": "Documento Evidencia de avance 2", "q": "Como equipo quiero entregar la evidencia de la semana 2 con pruebas reales de lo que ya funciona.", "ac": ["Usa la misma portada y formato que la Evidencia 1 e incluye una sección por objetivo: login por roles, maquetación base en las 3 plataformas y estructura de datos de habitaciones y turnos.", "Cada sección tiene capturas reales (no del Figma): login por rol, proyecto base de cada plataforma y la tabla de habitaciones y turnos con datos.", "La sección de datos muestra la migración, el seeder (5 VIP, 12 camas semiprivadas) y un llamado real a /habitaciones y /turnos.", "Lo que aún no funciona se dice tal cual, con fecha prevista.", "Incluye el enlace al Figma y al repositorio, con ortografía revisada."], "api": "GET /habitaciones · GET /turnos", "fig": "—", "dep": ["AUT-AND-1", "AUT-IOS-1", "AUT-WEB-1", "FUN-API-1"], "ref": []}, {"id": "DIS-DSG-1", "num": "HU-9", "ep": "DIS", "pl": "DSG", "h": "S2", "m": 1, "p": "Alta", "pts": 2, "t": "Auditar el Figma actual", "q": "Como equipo de diseño quiero saber qué pantallas se conservan, cuáles se corrigen y cuáles se eliminan antes de seguir diseñando.", "ac": ["Cada frame existente queda etiquetado como Conservar, Corregir o Eliminar.", "El archivo se reorganiza en páginas: Android, iOS, Web y Archivo (lo descartado).", "Queda una lista de pantallas faltantes por rol (paciente y la mayor parte de la web).", "El resultado se compara con la sección Revisión del Figma del plan."], "api": "—", "fig": "Todos", "dep": [], "ref": []}, {"id": "DIS-DSG-2", "num": "HU-10", "ep": "DIS", "pl": "DSG", "h": "S3", "m": 1, "p": "Alta", "pts": 3, "t": "Retirar del diseño lo que no está en los requisitos ni en la API", "q": "Como equipo quiero que el diseño muestre solo lo que el sistema hace para no prometer funciones que no existen.", "ac": ["Se elimina el selector de rol y el turno de ingreso del login; el rol sale de la cuenta.", "Se eliminan triaje Manchester, UCI, token dual, ID sanitario, HL7, HIPAA y menciones de leyes de otro país.", "Se eliminan telemetría, SpO2, oxígeno, pulsador y combustible de la ambulancia mientras no existan en la API.", "Los resultados de laboratorio con valores y la descarga de PDF se sustituyen por el estado de la orden, salvo que el equipo decida lo contrario (ver Decisiones).", "Los textos dicen Centro Médico de Occidente y las fechas de muestra son vigentes."], "api": "—", "fig": "4:655 · 4:2 · 4:1065 · 8:2 · 8:100 · 8:596 · 8:1706 · 10:2", "dep": ["DIS-DSG-1"], "ref": []}, {"id": "DIS-DSG-3", "num": "HU-11", "ep": "DIS", "pl": "DSG", "h": "S3", "m": 1, "p": "Alta", "pts": 3, "t": "Sistema de diseño básico", "q": "Como equipo quiero una paleta, tipografía y componentes con estados para que las tres plataformas se vean como un solo producto.", "ac": ["La paleta cumple contraste AA para texto y botones y está guardada como variables de Figma.", "Hay escala tipográfica, espaciado, íconos y los componentes base (botón, campo, tarjeta, chip de estado, barra de navegación, tabla).", "Cada componente muestra sus estados: normal, presionado, deshabilitado, error y cargando.", "Hay chips de estado definidos para citas, órdenes de laboratorio, camas y ambulancia."], "api": "—", "fig": "Nueva página Sistema de diseño", "dep": ["DIS-DSG-1"], "ref": []}, {"id": "DIS-DSG-4", "num": "HU-12", "ep": "DIS", "pl": "DSG", "h": "S3", "m": 1, "p": "Alta", "pts": 2, "t": "Diseño de autenticación: login, registro de paciente y cambio de contraseña", "q": "Como persona usuaria quiero entrar con mi usuario y contraseña y, si soy paciente, crear mi cuenta.", "ac": ["El login pide usuario y contraseña (no correo) y no tiene selector de rol.", "Están diseñados los errores: credenciales incorrectas, demasiados intentos (429) y cuenta inactiva.", "El registro de paciente tiene los campos de la API y el paso del código de activación cuando el DUI ya tiene expediente.", "Existe la pantalla de cambio de contraseña con aviso de que se cerrará la sesión.", "Hay versión móvil y versión web."], "api": "POST /auth/login · POST /auth/registro · PATCH /auth/password", "fig": "4:655 · 8:2 · nuevo (registro, web)", "dep": ["DIS-DSG-3"], "ref": []}, {"id": "DIS-DSG-5", "num": "HU-13", "ep": "DIS", "pl": "DSG", "h": "S3", "m": 1, "p": "Alta", "pts": 5, "t": "Flujos de recepción y enfermería (Android)", "q": "Como equipo Android quiero el flujo completo de recepción y enfermería diseñado para no improvisar al programar.", "ac": ["Están diseñadas: inicio, pacientes (buscar, registrar, editar, código de activación), citas (agendar, llegada, reprogramar, cancelar, confirmar solicitud), camas e ingresos, ambulancia, laboratorio, turnos propios, inventario (salidas) y avisos.", "Un mapa de flujo muestra cómo se llega de una pantalla a otra, con las acciones permitidas por estado.", "Cada pantalla tiene sus estados vacío, cargando y error.", "El diseño no muestra expediente clínico, tipo de sangre ni alergias a este rol."], "api": "—", "fig": "4:2 · 4:303 · 4:753 · 4:1065 · 4:1311 · 4:1602 + nuevas", "dep": ["DIS-DSG-2", "DIS-DSG-3"], "ref": []}, {"id": "DIS-DSG-6", "num": "HU-14", "ep": "DIS", "pl": "DSG", "h": "S3", "m": 1, "p": "Alta", "pts": 5, "t": "Flujos del médico (iOS y Android)", "q": "Como médico quiero que mi flujo esté diseñado de la agenda a la receta para atender sin pasos de más.", "ac": ["Están diseñadas: inicio, agenda del día, consulta (diagnóstico, recetas, orden de laboratorio, finalizar), expediente e historial, mis pacientes, laboratorio, turnos, ambulancia (estado y reportes) y pacientes ingresados.", "Un mapa de flujo conecta agenda, consulta, receta, orden de laboratorio y expediente.", "La ambulancia no muestra nombre ni dirección de la persona atendida.", "Hay variantes iOS y Android donde la plataforma lo exige."], "api": "—", "fig": "8:100 · 8:357 · 8:596 · 8:833 · 8:1132 · 8:1464 · 8:1706", "dep": ["DIS-DSG-2", "DIS-DSG-3"], "ref": []}, {"id": "DIS-DSG-7", "num": "HU-15", "ep": "DIS", "pl": "DSG", "h": "S3", "m": 1, "p": "Alta", "pts": 5, "t": "Flujos del paciente (iOS)", "q": "Como paciente quiero ver mis citas, mi expediente y mi laboratorio desde el teléfono.", "ac": ["Están diseñadas: registro con código de activación, inicio con información pública, mis citas, solicitud de atención, mi expediente, mi laboratorio (estados) y mi habitación.", "La pantalla pública (ocupación, médicos de turno, avisos, estado de la ambulancia) se ve sin iniciar sesión.", "El paciente nunca ve datos de otros pacientes, ni siquiera de quien comparte habitación.", "Cada pantalla tiene estados vacío, cargando y error."], "api": "—", "fig": "nuevo (hoy no hay pantallas de paciente; 8:1706 sirve de base para Mi habitación)", "dep": ["DIS-DSG-2", "DIS-DSG-3"], "ref": []}, {"id": "DIS-DSG-8", "num": "HU-16", "ep": "DIS", "pl": "DSG", "h": "S3", "m": 1, "p": "Alta", "pts": 8, "t": "Panel web administrativo completo", "q": "Como administrador quiero un panel para gestionar usuarios, espacios, recursos y ver métricas.", "ac": ["Están diseñadas: login, dashboard, usuarios, turnos (grilla), pacientes y expediente, citas, camas e ingresos, ambulancia y bitácora, laboratorio, inventario y avisos.", "El dashboard usa solo métricas que entrega /dashboard/metricas.", "El mapa de camas muestra la regla de 5 VIP en la planta 3 y 6 habitaciones de 2 camas en la planta 2.", "Cada módulo tiene sus estados vacío, cargando y error y se ve bien desde 1024 px."], "api": "GET /dashboard/metricas", "fig": "10:2 · 10:762 · 10:1561 · 10:2033 + nuevas", "dep": ["DIS-DSG-2", "DIS-DSG-3"], "ref": []}, {"id": "DIS-DSG-9", "num": "HU-17", "ep": "DIS", "pl": "DSG", "h": "S3", "m": 1, "p": "Alta", "pts": 3, "t": "Prototipo interactivo conectado", "q": "Como equipo quiero un prototipo que se pueda recorrer para presentarlo y para validar los flujos antes de programar.", "ac": ["Cada flujo de las HU-12 a HU-16 se puede recorrer de principio a fin con el modo prototipo.", "Los flujos tienen nombre y punto de partida claros por plataforma.", "El enlace del prototipo está en el README y en el documento de arquitectura.", "Quien no participó en el diseño puede recorrerlo sin explicación."], "api": "—", "fig": "Todos", "dep": ["DIS-DSG-4", "DIS-DSG-5", "DIS-DSG-6", "DIS-DSG-7", "DIS-DSG-8"], "ref": []}, {"id": "AUT-API-1", "num": "HU-18", "ep": "AUT", "pl": "API", "h": "S2", "m": 1, "p": "Alta", "pts": 1, "t": "Verificar login con los cuatro roles y CORS", "q": "Como equipo de clientes quiero confirmar que el login responde bien para cada rol antes de programar las pantallas.", "ac": ["Cuando inicio sesión con admin, medico.general, recepcion y paciente.uno, entonces cada respuesta trae usuario.rol correcto y, para el paciente, id_paciente.", "Una petición desde http://localhost:5173 no es bloqueada por CORS.", "Al exceder 5 intentos por minuto la API responde 429.", "Todas las respuestas respetan el formato success, message, data o errors."], "api": "POST /auth/login · GET /auth/me", "fig": "—", "dep": ["FUN-OPS-1"], "ref": []}, {"id": "AUT-AND-1", "num": "HU-19", "ep": "AUT", "pl": "AND", "h": "S2", "m": 1, "p": "Alta", "pts": 3, "t": "Iniciar sesión (Android)", "q": "Como recepcionista, enfermero o médico quiero iniciar sesión con mi usuario y contraseña para entrar a las pantallas de mi rol.", "ac": ["Dado un usuario válido, cuando envío el formulario, entonces el token se guarda cifrado y voy al inicio de mi rol (RECEPCIONISTA al operativo, MEDICO al del médico).", "Dado usuario o contraseña incorrectos, entonces veo Credenciales incorrectas sin perder lo escrito.", "Dado un ADMINISTRADOR o un PACIENTE, entonces veo un mensaje que indica usar el panel web o la app iOS y no queda sesión guardada.", "Dado un 429, entonces veo un aviso de espera.", "Mientras la petición está en curso el botón está deshabilitado y hay indicador de carga."], "api": "POST /auth/login", "fig": "4:655", "dep": ["FUN-AND-1"], "ref": ["AUT-API-1", "DIS-DSG-4"]}, {"id": "AUT-AND-2", "num": "HU-20", "ep": "AUT", "pl": "AND", "h": "S3", "m": 1, "p": "Media", "pts": 3, "t": "Sesión en Android: cerrar sesión, token vencido y cambio de contraseña", "q": "Como usuario quiero que mi sesión se cierre de forma segura y poder cambiar mi contraseña.", "ac": ["Cerrar sesión llama a POST /auth/logout y borra el token del dispositivo.", "Dado un 401 en cualquier pantalla, entonces la app vuelve al login con el mensaje correspondiente (token vencido o usuario inactivo).", "Dado el cambio de contraseña exitoso, entonces la app pide iniciar sesión otra vez porque la API revocó todos los tokens.", "Dado una contraseña actual incorrecta, entonces veo el error 422 en ese campo."], "api": "POST /auth/logout · PATCH /auth/password · GET /auth/me", "fig": "nuevo", "dep": ["AUT-AND-1"], "ref": []}, {"id": "AUT-IOS-1", "num": "HU-21", "ep": "AUT", "pl": "IOS", "h": "S2", "m": 1, "p": "Alta", "pts": 3, "t": "Iniciar sesión (iOS)", "q": "Como médico o paciente quiero iniciar sesión para ver la información que me corresponde.", "ac": ["Dado un MEDICO, entonces entro al inicio del médico; dado un PACIENTE, entonces entro al del paciente.", "El token se guarda en Keychain y no aparece en logs.", "Dado un ADMINISTRADOR o RECEPCIONISTA, entonces veo un mensaje que indica usar el panel web o la app Android.", "Los errores 401 y 429 muestran mensajes claros y el botón se deshabilita mientras carga."], "api": "POST /auth/login", "fig": "8:2", "dep": ["FUN-IOS-1"], "ref": ["AUT-API-1", "DIS-DSG-4"]}, {"id": "AUT-IOS-2", "num": "HU-22", "ep": "AUT", "pl": "IOS", "h": "S3", "m": 1, "p": "Alta", "pts": 5, "t": "Registro de paciente (iOS)", "q": "Como paciente quiero crear mi cuenta para consultar mis citas, mi expediente y mi laboratorio.", "ac": ["Dado datos válidos, entonces se crea la cuenta (201) y quedo con la sesión iniciada.", "Dado un DUI que recepción ya registró y sin código, entonces veo el error en codigo_acti : "Como hospital queremos que la app nunca muestre datos que el rol no puede ver.", "ac": ["Recepción no ve expediente, tipo de sangre ni alergias; el médico solo ve a sus pacientes.", "Un 403 muestra una pantalla de sin acceso sin revelar si el registro existe.", "La app no escribe tokens ni datos clínicos en los logs ni los guarda sin cifrar.", "La información pública se muestra sin enviar token."], "api": "—", "fig": "—", "dep": ["PER-AND-1", "CON-AND-2"], "ref": []}, {"id": "PRI-IOS-1", "num": "HU-79", "ep": "PRI", "pl": "IOS", "h": "S4", "m": 1, "p": "Alta", "pts": 3, "t": "Privacidad aplicada en iOS", "q": "Como hospital queremos que la app nunca muestre datos que el rol no puede ver.", "ac": ["El paciente solo ve sus datos y el médico solo a sus pacientes.", "Un 403 muestra una pantalla de sin acceso sin revelar si el registro existe.", "La app no escribe tokens ni datos clínicos en los logs y solo guarda el token en Keychain.", "La información pública se muestra sin enviar token."], "api": "—", "fig": "—", "dep": ["CON-IOS-3", "PER-IOS-1"], "ref": []}, {"id": "PRI-WEB-1", "num": "HU-80", "ep": "PRI", "pl": "WEB", "h": "S4", "m": 1, "p": "Alta", "pts": 3, "t": "Privacidad y control de acceso en la web", "q": "Como hospital queremos que el panel solo muestre lo que el administrador puede ver.", "ac": ["Las rutas del panel exigen rol ADMINISTRADOR y redirigen si no corresponde.", "Un 403 muestra una pantalla de sin acceso.", "La página pública no hace peticiones con token.", "No se guardan datos clínicos en localStorage ni en la URL."], "api": "—", "fig": "—", "dep": ["CON-WEB-1", "ADM-WEB-1"], "ref": []}, {"id": "QA-API-1", "num": "HU-81", "ep": "QA", "pl": "API", "h": "S5", "m": 0, "p": "Alta", "pts": 3, "t": "Pruebas de concurrencia con evidencia", "q": "Como equipo queremos demostrar que no hay sobrecupo ni doble despacho aunque varias personas actúen a la vez.", "ac": ["Dado dos ingresos simultáneos a la última cama libre, entonces uno responde 201 y el ot ": "DOC", "h": "S3", "m": 1, "p": "Alta", "pts": 3, "t": "Paquete de la entrega de avance del 31 de octubre", "q": "Como equipo queremos mostrar cada criterio de la entrega del 50% con evidencia.", "ac": ["Incluye el enlace al Figma al 100% con flujos de iOS, Android y Web.", "Incluye el diagrama entidad-relación y la lista de endpoints operativos (API.md o /docs/api).", "Incluye capturas reales de login y registro con roles, navegación principal en Xcode y Android Studio, CRUD de pacientes y personal, y el dashboard web.", "Dice con claridad qué falta y cuándo se entrega."], "api": "—", "fig": "—", "dep": ["DIS-DSG-9", "PER-WEB-1", "ADM-WEB-2", "AUT-IOS-2"], "ref": []}, {"id": "DOC-DOC-3", "num": "HU-90", "ep": "DOC", "pl": "DOC", "h": "S5", "m": 0, "p": "Alta", "pts": 3, "t": "Diagrama de arquitectura de software", "q": "Como equipo queremos explicar cómo interactúan iOS, Android, Web y el backend.", "ac": ["El diagrama muestra los tres clientes, la API REST con Sanctum, MariaDB y Reverb para tiempo real.", "Muestra las capas de la API (middleware, controladores, servicios y políticas, modelos) y el flujo de una petición.", "Está exportado como imagen para el PDF."], "api": "—", "fig": "—", "dep": [], "ref": []}, {"id": "DOC-DOC-4", "num": "HU-91", "ep": "DOC", "pl": "DOC", "h": "S5", "m": 0, "p": "Media", "pts": 2, "t": "Diagrama ER igual a la API (guardado para después)", "q": "Como equipo queremos que el diagrama coincida con la base de datos real antes de la entrega final.", "ac": ["El diagrama incluye las tablas consultorio y reporte_ambulancia y no muestra orden_laboratorio.resultado.", "Los campos y relaciones se contrastan con las migraciones de backend/database/migrations (el conteo de tablas se confirma contra ellas).", "diagrama-er.html queda actualizado y exportado como imagen para el PDF."], "api": "—", "fig": "—", "dep": [], "ref": []}, {"id": "DOC-DOC-5", "num": "HU-92", "ep": "DOC", "pl": "DOC", "h": "S4", "m": 1, "p": "Alta", "pts": 3, "t": "Matriz de control de acceso por rol (RBAC)", "q": "Como equipo queremos documentar qué puede hacer cada rol en endpoints y vistas.", "ac": ["La tabla cruza los 4 roles con cada endpoint y cada vista de las tres plataformas.", "Se contrasta con routes/api.php y con RbacTest.", "Cualquier cambio de permisos (por ejemplo HU-63) se refleja aquí."], "api": "—", "fig": "—", "dep": ["PRI-API-1"], "ref": []}, {"id": "DOC-DOC-6", "num": "HU-93", "ep": "DOC", "pl": "DOC", "h": "S4", "m": 1, "p": "Alta", "pts": 2, "t": "Política de privacidad de datos", "q": "Como equipo queremos documentar qué campos del expediente son públicos y cuáles privados.", "ac": ["La tabla de campos públicos vs. privados coincide con lo que realmente devuelve la API.", "Indica quién puede ver cada dato y cómo se aplica en cada plataforma.", "Está lista para incluirse en el documento de arquitectura."], "api": "—", "fig": "—", "dep": ["PRI-API-1"], "ref": []}, {"id": "DOC-DOC-7", "num": "HU-94", "ep": "DOC", "pl": "DOC", "h": "S6", "m": 0, "p": "Alta", "pts": 3, "t": "README principal y guías de ejecución", "q": "Como docente quiero poder instalar y correr las tres plataformas siguiendo el README.", "ac": ["Explica instalación, variables de entorno y ejecución de backend, Android, iOS y web, con los usuarios de demostración.", "Una persona del equipo que no escribió el README lo sigue desde cero y lo logra.", "Incluye los enlaces al Figma y al documento de arquitectura."], "api": "—", "fig": "—", "dep": ["FUN-OPS-3"], "ref": []}, {"id": "DOC-DOC-8", "num": "HU-95", "ep": "DOC", "pl": "DOC", "h": "S6", "m": 0, "p": "Alta", "pts": 5, "t": "Documento de arquitectura (PDF) final", "q": "Como equipo queremos entregar el documento técnico completo que pide el curso.", "ac": ["Contiene enlace al Figma con sistema de diseño, diagrama de arquitectura, diagrama de base de datos, matriz RBAC y política de privacidad.", "Todo coincide con el código entregado.", "Se entrega en PDF junto al repositorio unificado."], "api": "—", "fig": "—", "dep": ["DOC-DOC-3", "DOC-DOC-4", "DOC-DOC-5", "DOC-DOC-6", "DIS-DSG-9"], "ref": []}, {"id": "DOC-DOC-9", "num": "HU-96", "ep": "DOC", "pl": "DOC", "h": "S6", "m": 0, "p": "Alta", "pts": 3, "t": "Preparar la defensa técnica", "q": "Como equipo queremos llegar a la defensa con un recorrido ensayado.", "ac": ["Cada persona sabe qué parte presenta y en qué plataforma.", "Se ensaya el recorrido completo con cronómetro al menos dos veces.", "Existe un plan B (capturas o video) si falla la red o un dispositivo."], "api": "—", "fig": "—", "dep": ["QA-OPS-1"], "ref": []}], "decisiones": [{"id": "D1", "t": "¿Los resultados de laboratorio muestran valores?", "d": "El PDF pide un módulo con estados (Pendiente, En proceso, Completado). La API ya guarda solo estados y el Figma muestra valores y PDF. Se propone seguir la API.", "r": "Propuesta: solo estados."}, {"id": "D2", "t": "iOS y la Mac", "d": "El equipo ya tiene una Mac para Xcode. iOS vive en la carpeta ios/ del mismo repositorio.", "r": "Decidido.", "ok": true}, {"id": "D3", "t": "¿Cómo se llega a la API durante la defensa?", "d": "Local en la red del equipo o servidor desplegado. Para el sábado basta local.", "r": "Pendiente; ver FUN-OPS-4."}, {"id": "D4", "t": "Enfermería y asistentes son el rol RECEPCIONISTA", "d": "La API usa 4 roles y distingue por cargo. El login del Figma ofrecía Recepción, Enfermería y Médico como perfiles.", "r": "Propuesta: un solo rol, el cargo se muestra en el perfil."}, {"id": "D5", "t": "ER igual que la API", "d": "El diagrama se corrige después, sin cambiar la API; queda como DOC-DOC-4.", "r": "Decidido.", "ok": true}, {"id": "D6", "t": "Un solo repositorio para las tres plataformas", "d": "backend/, android/, ios/, web/ y docs/ viven en el mismo repositorio. Cada plataforma tiene su carpeta y se compila sin las demás, así que quien trabaja en Android no toca el código de iOS.", "r": "Decidido.", "ok": true}]}</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('datos').textContent);
const HU = D.hu, BYID = Object.fromEntries(HU.map(h=>[h.id,h]));
const EP = Object.fromEntries(D.epicas.map(e=>[e.id,e]));
const HITO = Object.fromEntries(D.hitos.map(h=>[h.id,h]));
const PL = {AND:['Android','--p-and'],IOS:['iOS','--p-ios'],WEB:['Web','--p-web'],API:['API','--p-api'],DSG:['Diseño','--p-dsg'],DOC:['Documentos','--p-doc'],OPS:['Equipo','--p-ops']};
const ESTADOS = {libre:'Libre',en_curso:'En curso',revision:'En revisión',hecha:'Hecha'};
const EXIG = {S2:'Entrega del sábado',S3:'Mínimo del 31 oct',S4:'Criterio de la entrega final'};
/* Ruta de trabajo: orden dentro de cada plataforma, por hito y respetando las dependencias de la misma plataforma. */
const ORD = {};
Object.keys(PL).forEach(p=>{
  const hecho=new Set(); let n=0;
  let resto=HU.filter(h=>h.pl===p).sort((a,b)=>(+a.h.slice(1))-(+b.h.slice(1))||HU.indexOf(a)-HU.indexOf(b));
  while(resto.length){
    const i=resto.findIndex(h=>h.dep.filter(x=>BYID[x].pl===p).every(x=>hecho.has(x)));
    const h=resto.splice(i<0?0:i,1)[0]; hecho.add(h.id); ORD[h.id]=++n;
  }
});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const JIRA = 'https://centromedicodeoccidente.atlassian.net';

/* ---------- estado ---------- */
const S = { tab:'plan', plat:'AND', open:new Set(), f:{q:'',ep:'',pl:'',h:'',estado:'',min:false,libres:false,mios:false},
  claims:new Map(), names:{}, me:null, canWrite:null, canEdit:false, db:null, busy:new Set(), live:false };

const claim = id => S.claims.get(id) || {estado:'libre'};
const estadoDe = id => claim(id).estado || 'libre';
const nombre = id => (id && S.names[id]) || (id ? 'Alguien del equipo' : '');
const puedeEscribir = () => !!S.db && S.canWrite !== false;
const puedeEditar = id => puedeEscribir() && (S.canEdit || (S.me && claim(id).dueno === S.me));

function chipPl(p){const [n,c]=PL[p]||[p,'--ink-2'];return `<span class="chip" style="--c:var(${c})"><i></i>${esc(n)}</span>`}
function pillEstado(e){return `<span class="pill ${e}">${ESTADOS[e]}</span>`}
function conteo(list){const c={libre:0,en_curso:0,revision:0,hecha:0};list.forEach(h=>c[estadoDe(h.id)]++);return c}
function barra(list){
  const c=conteo(list), n=list.length||1;
  const seg=['hecha','revision','en_curso'].map(k=>c[k]?`<i class="b-${k}" style="width:${c[k]/n*100}%" title="${ESTADOS[k]}: ${c[k]}"></i>`:'').join('');
  return `<div class="bar" role="img" aria-label="${c.hecha} hechas, ${c.revision} en revisión, ${c.en_curso} en curso de ${list.length}">${seg}</div>
  <div class="bartxt"><span>${c.hecha} hechas · ${c.revision} en revisión · ${c.en_curso} en curso</span><span>${list.length} HU</span></div>`;
}
function huChip(id){
  const h=BYID[id]; if(!h) return '';
  return `<a class="chip mono" data-goto="${esc(id)}" role="button" tabindex="0" title="${esc(h.t)}">${esc(h.num)} · ${ESTADOS[estadoDe(id)]}</a>`;
}

/* ---------- PLAN ---------- */
function renderPlan(){
  const pts = HU.reduce((a,h)=>a+h.pts,0);
  const hitos = D.hitos.map(h=>{
    const l=HU.filter(x=>x.h===h.id), ex=l.filter(x=>x.m).length;
    return `<div class="card hito"><div class="muted small mono">${h.id} · ${esc(h.nombre)}</div><div class="fecha">${esc(h.fecha)}</div>
      <p class="small">${esc(h.meta)}</p>${barra(l)}
      <p class="small muted">${ex?`${ex} HU exigidas por el PDF · `:''}${l.length-ex} complementarias</p>
      <button data-hito="${h.id}">Ver estas HU</button></div>`;}).join('');
  const plats = Object.keys(PL).map(p=>{const l=HU.filter(h=>h.pl===p);return `<div class="card"><div>${chipPl(p)}</div><div style="margin-top:8px">${barra(l)}</div></div>`}).join('');
  const dec = D.decisiones.slice().sort((a,b)=>(a.ok?1:0)-(b.ok?1:0)).map(d=>`<div class="card"><div class="line1"><span class="pill ${d.ok?'hecha':'dec'}">${d.ok?'Decidida':'Abierta'}</span> <span class="id">${d.id}</span> <b>${esc(d.t)}</b></div><p class="small muted" style="margin-top:6px">${esc(d.d)}</p><p class="small" style="margin-top:6px"><b>${esc(d.r)}</b></p></div>`).join('');
  $('#t-plan').innerHTML = `
    <div><h2>Un solo plan para las tres plataformas</h2>
    <p class="lead" style="margin-top:8px">Cada historia de usuario (HU) tiene su rol, sus criterios de aceptación, los endpoints que usa y la pantalla del Figma que le corresponde. Cualquiera puede tomar una HU libre y empezar. Lo que se tomó y lo que se terminó queda visible para todo el equipo.</p></div>
    <div class="card"><div class="stat">
      <div><b>${HU.length}</b><span>historias</span></div><div><b>${D.epicas.length}</b><span>épicas</span></div>
      <div><b>${pts}</b><span>puntos</span></div><div><b>${HU.filter(h=>estadoDe(h.id)==='hecha').length}</b><span>hechas</span></div>
      <div><b>${HU.filter(h=>estadoDe(h.id)==='libre').length}</b><span>libres</span></div></div></div>
    <div><h3 style="margin-bottom:10px">Hitos del cronograma</h3><div class="grid g5">${hitos}</div></div>
    <div class="grid g2">
      <div class="card"><h3>Cómo se trabaja una HU</h3><ol class="steps" style="margin-top:12px">
        <li><span>Entra a <b>Plataformas</b> o a <b>Backlog</b>, filtra por tu plataforma y toma la siguiente HU libre de la ruta (el número <i>Ruta #</i>).</span></li>
        <li><span>Pulsa <b>Tomar</b>. Queda con tu nombre y en <i>En curso</i>.</span></li>
        <li><span>Trabaja en tu rama de la semana, <code>&lt;plataforma&gt;-&lt;persona&gt;-s&lt;N&gt;</code> (por ejemplo <code>ios-kath-s2</code>), y empieza cada commit con el número de la HU (por ejemplo <code>HU-24</code>). Detalle en Referencia.</span></li>
        <li><span>Cuando cumplas todos los criterios, cambia a <b>En revisión</b>. Otra persona la prueba y la marca <b>Hecha</b>.</span></li></ol></div>
      <div class="card"><h3>Cuándo una HU está hecha</h3><ul class="ticks" style="margin-top:8px">
        <li>Cumple todos sus criterios de aceptación, no solo el camino feliz.</li>
        <li>Se probó contra la API real, con un usuario del rol correcto.</li>
        <li>Maneja 401, 403, 409, 422 y 429 mostrando el mensaje de la API.</li>
        <li>Tiene estados vacío, cargando y error.</li>
        <li>No escribe tokens ni datos clínicos en logs.</li>
        <li>Coincide con el Figma, o el Figma se actualiza en el mismo PR.</li>
        <li>Otra persona del equipo la revisó.</li></ul></div></div>
    <div class="card"><h3>Para trabajar de corrido, sin esperar a nadie</h3><ul class="ticks" style="margin-top:8px">
      <li><b>Cada plataforma tiene su ruta numerada.</b> Quien termina una HU toma la siguiente libre; el orden ya respeta lo que depende de qué dentro de esa plataforma.</li>
      <li><b>Lo único que va antes de todo</b> es FUN-OPS-1, FUN-OPS-2 y FUN-OPS-3 (levantar la API, estructura del repositorio y configuración). Se hacen una sola vez, y después todas las plataformas avanzan en paralelo.</li>
      <li><b>La API ya existe.</b> Las apps no esperan a las HU de API; esas solo verifican y completan. Si falta un filtro, la app filtra por su cuenta mientras tanto.</li>
      <li><b>El Figma no bloquea.</b> Si la pantalla aún no está diseñada, se parte del frame de referencia o de la descripción de la pestaña App terminada, y se ajusta cuando el diseño llegue.</li>
      <li><b>Se apoya en, sin esperar</b> aparece en una HU cuando conviene mirar otra (un diseño o una HU de API), pero no hay que esperar a que termine.</li>
      <li>Los documentos (DOC) y las pruebas de integración (QA) sí van al final, porque describen lo que ya se construyó.</li></ul></div>
    <div><h3 style="margin-bottom:10px">Avance por plataforma</h3><div class="grid g3">${plats}</div></div>
    <div><h3 style="margin-bottom:10px">Decisiones</h3><div class="grid g2">${dec}</div></div>`;

function filtrar(){
  const f=S.f, q=f.q.trim().toLowerCase();
  return HU.filter(h=>{
    if(f.ep&&h.ep!==f.ep) return false; if(f.pl&&h.pl!==f.pl) return false; if(f.h&&h.h!==f.h) return false;
    if(f.estado&&estadoDe(h.id)!==f.estado) return false;
    if(f.min&&!h.m) return false; if(f.libres&&estadoDe(h.id)!=='libre') return false;
    if(f.mios&&claim(h.id).dueno!==S.me) return false;
    if(q&&!(h.num+' '+h.id+' '+h.t+' '+h.q+' '+h.api).toLowerCase().includes(q)) return false;
    return true;}).sort((a,b)=>(+a.h.slice(1))-(+b.h.slice(1))||(a.pl<b.pl?-1:a.pl>b.pl?1:0)||ORD[a.id]-ORD[b.id]);
}
function huRow(h){

      if(e==='libre') return `<div class="actions"><button class="btn" data-act="tomar" data-id="${h.id}"${b}>Tomar esta HU</button></div>`;
      if(!mine) return `<p class="small muted">La tiene ${esc(nombre(c.dueno))}. Solo esa persona (o quien administra el artefacto) puede cambiarla.</p>`;
      return `<div class="actions"><label class="small muted" for="e-${h.id}">Estado</label>
        <select id="e-${h.id}" data-act="estado" data-id="${h.id}"${b}>${['en_curso','revision','hecha'].map(k=>`<option value="${k}"${k===e?' selected':''}>${ESTADOS[k]}</option>`).join('')}</select>

        <div class="actions"><label class="small muted" for="n-${h.id}">Nota</label><textarea id="n-${h.id}" data-act="nota" data-id="${h.id}" placeholder="Rama, PR, bloqueos…">${esc(c.nota||'')}</textarea></div>`;
    })();
    body = `<div class="body">
      <p style="margin-top:12px">${esc(h.q)}</p>

        ${c.nota&&!puedeEditar(h.id)?`<div><b>Nota:</b> ${esc(c.nota)}</div>`:''}

      </div>${acts}</div>`;
  }
  return `<article class="hu" data-id="${h.id}"><button class="head" data-toggle="${h.id}" aria-expanded="${open}">
    <span class="line1"><span class="id">${h.num} · ${h.id}</span><span class="t">${esc(h.t)}</span></span>

    ${h.m?`<span class="pill exig" title="${esc(EXIG[h.h]||'')}">Exigida</span>`:''}${pillEstado(e)}${dueno}</span></button>${body}</article>`;
}

      <p class="small muted" style="margin-top:6px">Las 15 épicas y las 96 HU están cargadas en el proyecto Centro Médico de Occidente. Jira da las claves en orden, así que el número del plan y la clave de Jira se relacionan así:</p>
      <ul class="ticks small" style="margin-top:8px">
        <li><b>HU-n</b> es <code>SCRUM-(n+19)</code>. Por ejemplo, HU-24 es SCRUM-43.</li>
        <li><b>EPIC-n</b> es <code>SCRUM-(n+4)</code>. Por ejemplo, EPIC-3 es SCRUM-7.</li>
        <li>El número HU-n está al inicio del título de cada issue, así que se puede buscar en Jira por ese texto.</li>
        <li>Todas se crearon sin sprint. Se pasan a Sprint 1 desde el tablero; las entregas por semana se distinguen con las etiquetas <code>s2</code> a <code>s6</code>.</li></ul>
      <p class="small" style="margin-top:8px"><a href="https://centromedicodeoccidente.atlassian.net/issues?jql=project%20%3D%20SCRUM" target="_blank" rel="noopener">Abrir el proyecto en Jira</a></p></div>
    <div class="card"><h3>Ramas y commits</h3>
      <p class="small muted" style="margin-top:6px">Una rama por persona, plataforma y semana. Se crea al empezar la semana y se cierra con un pull request al terminar. Así hay pocas ramas y cada una dice de quién es.</p>
      <div style="margin-top:12px">${cmd('<plataforma>-<persona>-s<N>')}</div>
      <div class="tablewrap" style="margin-top:12px"><table><tbody>
        <tr><th>plataforma</th><td><code>android</code>, <code>ios</code>, <code>web</code>, <code>api</code>, <code>docs</code></td></tr>
        <tr><th>persona</th><td>Nombre corto en minúscula y sin acentos: <code>dennis</code>, <code>mario</code>, <code>luis</code>, <code>rene</code>, <code>kath</code></td></tr>
        <tr><th>s&lt;N&gt;</th><td>La entrega a la que va el trabajo: <code>s2</code> (24 oct), <code>s3</code> (31 oct), <code>s4</code> (7 nov), <code>s5</code> (14 nov), <code>s6</code> (21 nov). Es el mismo hito que muestra cada HU.</td></tr>
        <tr><th>ejemplos</th><td><code>ios-kath-s2</code> · <code>web-luis-s3</code> · <code>android-dennis-s3</code></td></tr></tbody></table></div>
      <ul class="ticks small" style="margin-top:12px">
        <li>La rama sale de <code>development</code> actualizado. Cada vez que empieces a trabajar, trae lo nuevo: <code>git fetch</code> y <code>git merge origin/development</code>.</li>
        <li>Cada commit empieza con el número de la HU: <code>HU-24: login del administrador</code>.</li>
        <li>Al terminar la semana abres un pull request a <code>development</code>, con las HU hechas en la descripción y otra persona revisando. Si otra plataforma depende de lo tuyo (por ejemplo el login), abres el pull request antes.</li>
        <li>Nadie hace push directo a <code>development</code>.</li>
        <li><b>Las ramas no se borran.</b> Cada semana deja su rama como historial; en GitHub no pulses «Delete branch» al integrar. La semana siguiente nace una nueva desde <code>development</code>, por ejemplo <code>ios-kath-s3</code>.</li>
        <li>Todo lo que se termina entra a <code>development</code> y todos traen de <code>development</code> antes de empezar y antes de abrir su pull request.</li>
        <li>Dos personas en la misma plataforma se reparten módulos con el botón Tomar del Backlog, para no editar los mismos archivos.</li>
        <li>Nunca se suben <code>.env</code>, <code>local.properties</code> ni claves.</li></ul>
      <div class="callout" style="margin-top:12px"><b>Antes de empezar.</b> <code>development</code> solo tiene el commit inicial y la API vive en <code>feature/hospital-universitario</code>. Esa rama tiene que entrar a <code>development</code> con un pull request para que todas las ramas nuevas salgan ya con el backend. Esto es parte de FUN-OPS-2.</div></div>

/* ---------- vista ---------- */
function setTab(t, push){
  S.tab=t;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  document.querySelectorAll('section.panel').forEach(s=>s.classList.toggle('hidden',s.id!=='t-'+t));
  if(push){try{history.replaceState(null,'','#'+t)}catch(e){}}
  window.scrollTo({top:0});
}
function refreshAll(){
  if(document.activeElement && document.activeElement.tagName==='TEXTAREA' && S.tab==='backlog'){ S.pending=true; return; }
  S.pending=false;
  renderPlan(); renderSabado(); renderEntregas(); renderPlataformas(); renderFinal();
  if($('#f-list')) renderBacklogList(); else renderBacklogShell();
  renderReferencia();
  const w=$('#who'); w.textContent = S.me && S.names[S.me] ? 'Sesión: '+S.names[S.me] : (S.db?'':'Vista de solo lectura');
  const b=$('#banner');
  b.innerHTML = !S.db ? `<div class="callout info small">El seguimiento compartido (tomar y terminar HU) no está disponible en esta vista. Se puede leer todo el plan.</div>` :
    (S.canWrite===false ? `<div class="callout info small">Puedes ver quién trabaja en qué. Para tomar HU, pide acceso de colaborador al artefacto.</div>` : '');
}

/* ---------- eventos ---------- */
function irA(id){
  const h=BYID[id]; if(!h) return;
  S.f={q:'',ep:'',pl:'',h:'',estado:'',min:false,libres:false,mios:false}; S.open.add(id);
  setTab('backlog',true); renderBacklogShell();
  const el=document.querySelector('#t-backlog article.hu[data-id="'+id+'"]'); if(el) el.scrollIntoView({block:'center'});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-hito],[data-plat],[data-toggle],[data-goto],[data-act],#f-clear'); if(!t) return;
  if(t.dataset.tab){ setTab(t.dataset.tab,true); return; }
  if(t.dataset.hito){ S.f={q:'',ep:'',pl:'',h:t.dataset.hito,estado:'',min:false,libres:false,mios:false}; setTab('backlog',true); renderBacklogShell(); return; }
  if(t.dataset.plat){ S.plat=t.dataset.plat; renderPlataformas(); return; }
  if(t.dataset.goto){ irA(t.dataset.goto); return; }
  if(t.dataset.toggle){ const id=t.dataset.toggle; S.open.has(id)?S.open.delete(id):S.open.add(id);
    document.querySelectorAll('article.hu[data-id="'+id+'"]').forEach(a=>{a.outerHTML=huRow(BYID[id]);}); return; }
  if(t.id==='f-clear'){ S.f={q:'',ep:'',pl:'',h:'',estado:'',min:false,libres:false,mios:false}; renderBacklogShell(); return; }
  if(t.dataset.act==='tomar') escribir(t.dataset.id,'tomar');
  if(t.dataset.act==='soltar') escribir(t.dataset.id,'soltar');
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-goto]')){e.preventDefault();irA(e.target.dataset.goto);} });
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-q'){ S.f.q=t.value; renderBacklogList(); }
});
document.addEventListener('change',e=>{
  const t=e.target, m={ 'f-pl':'pl','f-ep':'ep','f-h':'h','f-estado':'estado' };
  if(m[t.id]){ S.f[m[t.id]]=t.value; renderBacklogList(); return; }
  if(t.id==='f-libres'||t.id==='f-min'||t.id==='f-mios'){ S.f[t.id.slice(2)]=t.checked; renderBacklogList(); return; }
  if(t.dataset.act==='estado') escribir(t.dataset.id,'estado',t.value);
});
document.addEventListener('focusout',e=>{
  const t=e.target;
  if(t.dataset && t.dataset.act==='nota'){ escribir(t.dataset.id,'nota',t.value).finally(()=>{ if(S.pending) refreshAll(); }); }
  else if(S.pending) setTimeout(()=>{ if(document.activeElement.tagName!=='TEXTAREA') refreshAll(); },0);
});

/* ---------- escritura compartida ---------- */
async function escribir(id,que,valor){
  if(!puedeEscribir()||S.busy.has(id)) return;
  const cur=claim(id), ref=S.db.doc('hu/'+id);
  let datos;
  if(que==='tomar'){ if(!S.me||estadoDe(id)!=='libre') return; datos={estado:'en_curso',dueno:S.me,nota:'',ts:Date.now()}; }
  else if(que==='estado'){ if(!puedeEditar(id)||cur.estado===valor) return; datos={...cur,estado:valor,ts:Date.now()}; }
  else if(que==='nota'){ if(!puedeEditar(id)||(cur.nota||'')===valor) return; datos={...cur,nota:valor.slice(0,500),ts:Date.now()}; }
  else if(que==='soltar'){ if(!puedeEditar(id)) return; }
  S.busy.add(id);
  try{ que==='soltar' ? await ref.delete() : await ref.set(datos); }
  catch(err){ const b=$('#banner'); b.innerHTML=`<div class="callout small">No se pudo guardar el cambio en ${esc(id)}${err&&err.code==='invalid_argument'?': tu acceso es de solo lectura.':'. Intenta de nuevo.'}</div>`; if(err&&err.code==='invalid_argument') S.canWrite=false; }
  finally{ S.busy.delete(id); }
}
async function cargarNombres(){
  const user=S.user; if(!user) return;
  const ids=[...new Set([...S.claims.values()].map(c=>c.dueno).concat(S.me).filter(Boolean))];
  if(!ids.length) return;
  const ps=await user.profiles(ids);
  let cambio=false; for(const id of ids){ const n=ps[id]&&ps[id].name; if(n&&S.names[id]!==n){S.names[id]=n;cambio=true;} }
  if(cambio) refreshAll();
}
async function iniciarDb(){
  if(!(window.claude&&window.claude.use)) return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db) return;
    S.db=db; S.user=user;
    if(user){ S.me=await user.id(); S.canWrite=await user.can('data.write'); S.canEdit=await user.canEdit(); }
    db.collection('hu').onSnapshot(snap=>{
      const m=new Map(); snap.docs.forEach(d=>{ if(d.exists) m.set(d.id,d.data()); });
      S.claims=m; S.live=true; refreshAll(); cargarNombres();
    },err=>{ if(err&&err.code==='revoked'){ S.db=null; refreshAll(); } });
    refreshAll();
  }catch(e){ S.db=null; refreshAll(); }
}

/* ---------- arranque ---------- */
renderBacklogShell();
refreshAll();
const inicial=(location.hash||'').slice(1);
setTab(['plan','sabado','entregas','plataformas','final','backlog','referencia'].includes(inicial)?inicial:'plan',false);
iniciarDb();
})();
