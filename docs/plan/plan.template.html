<style>
/* Layout: cabecera fija con pestañas; contenido en una columna de lectura de 1100px; el backlog es una lista filtrable de filas expandibles. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface-2:#e8efeb; --ink:#13221c; --ink-2:#4a5c53; --line:#d1dcd6;
  --brand:#0b5d4b; --brand-ink:#ffffff; --brand-soft:#d6ebe3;
  --info:#0e5c86; --info-soft:#dbebf4; --warn:#85560a; --warn-soft:#fae9c8; --bad:#a3262a; --bad-soft:#f7dada; --good:#1a7541; --good-soft:#d9efe1;
  --p-and:#2e8b57; --p-ios:#2f6fd0; --p-web:#c27a12; --p-api:#5b6b78; --p-dsg:#b0407a; --p-doc:#7a6f5a; --p-ops:#6a55b8;
  --f-head:"Schibsted Grotesk",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1612; --surface:#15221d; --surface-2:#1d2d26; --ink:#e5efea; --ink-2:#a2b7ad; --line:#2b4036;
  --brand:#4fc4a2; --brand-ink:#06201a; --brand-soft:#17382f;
  --info:#6cb7e3; --info-soft:#14313f; --warn:#e6b455; --warn-soft:#3a2d12; --bad:#f08a8c; --bad-soft:#3d1c1d; --good:#68d196; --good-soft:#16361f;
  --p-and:#5fcf93; --p-ios:#7aa6f0; --p-web:#e4a447; --p-api:#94a5b3; --p-dsg:#e285b5; --p-doc:#bdb299; --p-ops:#a894ee; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1612; --surface:#15221d; --surface-2:#1d2d26; --ink:#e5efea; --ink-2:#a2b7ad; --line:#2b4036;
  --brand:#4fc4a2; --brand-ink:#06201a; --brand-soft:#17382f;
  --info:#6cb7e3; --info-soft:#14313f; --warn:#e6b455; --warn-soft:#3a2d12; --bad:#f08a8c; --bad-soft:#3d1c1d; --good:#68d196; --good-soft:#16361f;
  --p-and:#5fcf93; --p-ios:#7aa6f0; --p-web:#e4a447; --p-api:#94a5b3; --p-dsg:#e285b5; --p-doc:#bdb299; --p-ops:#a894ee; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3{font-family:var(--f-head);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--info)}
code,.mono{font-family:var(--f-mono);font-size:.82em}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto}
.brandrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brandrow h1{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.brandrow .sub{color:var(--ink-2);font-size:.88rem}
.who{font-size:.85rem;color:var(--ink-2)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap;color:var(--ink-2);font-weight:600}
nav.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
main{padding-top:24px;display:grid;gap:28px}
section.panel{display:grid;gap:20px}
.lead{max-width:68ch;color:var(--ink-2)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
.card h3+p,.card h3+ul{margin-top:6px}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.stat{display:flex;gap:20px;flex-wrap:wrap}
.stat div{display:grid}
.stat b{font:700 1.7rem var(--f-head);font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-2))}
.chip.mono{font-family:var(--f-mono);font-weight:400}
.pill{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:5px;white-space:nowrap}
.pill.libre{background:var(--surface-2);color:var(--ink-2)}
.pill.en_curso{background:var(--info-soft);color:var(--info)}
.pill.revision{background:var(--warn-soft);color:var(--warn)}
.pill.hecha{background:var(--good-soft);color:var(--good)}
.pill.exig{background:var(--brand-soft);color:var(--brand)}
.pill.dec{background:var(--warn-soft);color:var(--warn)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;height:100%}
.bar .b-hecha{background:var(--good)} .bar .b-revision{background:var(--warn)} .bar .b-en_curso{background:var(--info)}
.bartxt{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:4px}
.hito{display:grid;gap:8px;align-content:start}
.hito .fecha{font:700 1.5rem var(--f-head)}
.hito button{justify-self:start;background:none;border:0;padding:0;color:var(--info);cursor:pointer;text-decoration:underline;font-size:.86rem}
.steps{display:grid;gap:10px;padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}
ul.ticks{margin:0;padding-left:18px;display:grid;gap:4px}
.callout{border-left:4px solid var(--warn);background:var(--warn-soft);padding:12px 14px;border-radius:0 6px 6px 0}
.callout.ok{border-color:var(--good);background:var(--good-soft)}
.callout.info{border-color:var(--info);background:var(--info-soft)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--surface-2);font-weight:600;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.no{color:var(--ink-2)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow span{background:var(--surface-2);padding:3px 9px;border-radius:5px;font-size:.84rem}
.flow b{color:var(--ink-2);font-weight:400}
.platbar{display:flex;flex-wrap:wrap;gap:6px}
.platbar button,.pillbtn{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600}
.platbar button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));align-items:end}
.filters label{display:grid;gap:3px;font-size:.78rem;font-weight:600;color:var(--ink-2)}
.filters input[type=search],.filters select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-width:0}
.checks{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}
.checks label{display:flex;gap:6px;align-items:center;font-weight:400;color:var(--ink)}
.list{display:grid;gap:8px}
.hu{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.hu>button.head{width:100%;background:none;border:0;text-align:left;padding:12px 14px;cursor:pointer;display:grid;gap:6px}
.hu .line1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hu .id{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2)}
.hu .t{font-weight:600}
.hu .line2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hu .own{margin-left:auto;font-size:.82rem;color:var(--ink-2)}
.hu .body{padding:0 14px 14px;display:grid;gap:12px;border-top:1px solid var(--line)}
.hu .body h4{font:600 .8rem var(--f-head);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:12px 0 4px}
.hu ol,.hu ul{margin:0;padding-left:20px;display:grid;gap:4px}
.hu .meta{display:grid;gap:4px;font-size:.88rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions select,.actions textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.actions textarea{flex:1 1 220px;min-height:36px;resize:vertical}
.dep a{cursor:pointer}
pre.cmd{margin:0;background:var(--surface-2);border-radius:6px;padding:10px 12px;overflow-x:auto;font:400 .82rem/1.5 var(--f-mono);position:relative}
.empty{padding:24px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:8px}
.scr{display:grid;gap:6px;align-content:start}
.scr h4{font:600 1rem var(--f-head);margin:0}
.scr dl{margin:0;display:grid;gap:4px;font-size:.88rem}
.scr dt{font-weight:600;color:var(--ink-2);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.scr dd{margin:0}
.grouph{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){.hu .body{animation:in .12s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>

<header class="top"><div class="top-in">
  <div class="brandrow">
    <div><h1>Centro Médico de Occidente</h1><div class="sub">Plan de trabajo · iOS, Android, Web y API</div></div>

  </div>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button role="tab" data-tab="plan">Plan</button>
    <button role="tab" data-tab="sabado">Sábado 24</button>

<main class="wrap" id="main">
  <div id="banner"></div>
  <section class="panel" id="t-plan"></section>
  <section class="panel" id="t-sabado"></section>
  <section class="panel" id="t-entregas"></section>
  <section class="panel" id="t-plataformas"></section>

  <section class="panel" id="t-referencia"></section>

<script id="datos" type="application/json">__BACKLOG__</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('datos').textContent);
const HU = D.hu, BYID = Object.fromEntries(HU.map(h=>[h.id,h]));
const EP = Object.fromEntries(D.epicas.map(e=>[e.id,e]));
const HITO = Object.fromEntries(D.hitos.map(h=>[h.id,h]));
const PL = {AND:['Android','--p-and'],IOS:['iOS','--p-ios'],WEB:['Web','--p-web'],API:['API','--p-api'],DSG:['Diseño','--p-dsg'],DOC:['Documentos','--p-doc'],OPS:['Equipo','--p-ops']};
const ESTADOS = {libre:'Libre',en_curso:'En curso',revision:'En revisión',hecha:'Hecha'};
const EXIG = {S2:'Entrega del sábado',S3:'Mínimo del 31 oct',S4:'Criterio de la entrega final'};
/* Ruta de trabajo: orden dentro de cada plataforma, por hito y respetando las dependencias de la misma plataforma. */
const ORD = {};
Object.keys(PL).forEach(p=>{
  const hecho=new Set(); let n=0;
  let resto=HU.filter(h=>h.pl===p).sort((a,b)=>(+a.h.slice(1))-(+b.h.slice(1))||HU.indexOf(a)-HU.indexOf(b));
  while(resto.length){
    const i=resto.findIndex(h=>h.dep.filter(x=>BYID[x].pl===p).every(x=>hecho.has(x)));
    const h=resto.splice(i<0?0:i,1)[0]; hecho.add(h.id); ORD[h.id]=++n;
  }
});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

/* ---------- estado ---------- */
const S = { tab:'plan', plat:'AND', open:new Set(), f:{q:'',ep:'',pl:'',h:'',estado:'',min:false,libres:false,mios:false},
  claims:new Map(), names:{}, me:null, canWrite:null, canEdit:false, db:null, busy:new Set(), live:false };

const claim = id => S.claims.get(id) || {estado:'libre'};
const estadoDe = id => claim(id).estado || 'libre';
const nombre = id => (id && S.names[id]) || (id ? 'Alguien del equipo' : '');
const puedeEscribir = () => !!S.db && S.canWrite !== false;
const puedeEditar = id => puedeEscribir() && (S.canEdit || (S.me && claim(id).dueno === S.me));

function chipPl(p){const [n,c]=PL[p]||[p,'--ink-2'];return `<span class="chip" style="--c:var(${c})"><i></i>${esc(n)}</span>`}
function pillEstado(e){return `<span class="pill ${e}">${ESTADOS[e]}</span>`}
function conteo(list){const c={libre:0,en_curso:0,revision:0,hecha:0};list.forEach(h=>c[estadoDe(h.id)]++);return c}
function barra(list){
  const c=conteo(list), n=list.length||1;
  const seg=['hecha','revision','en_curso'].map(k=>c[k]?`<i class="b-${k}" style="width:${c[k]/n*100}%" title="${ESTADOS[k]}: ${c[k]}"></i>`:'').join('');
  return `<div class="bar" role="img" aria-label="${c.hecha} hechas, ${c.revision} en revisión, ${c.en_curso} en curso de ${list.length}">${seg}</div>
  <div class="bartxt"><span>${c.hecha} hechas · ${c.revision} en revisión · ${c.en_curso} en curso</span><span>${list.length} HU</span></div>`;
}
function huChip(id){
  const h=BYID[id]; if(!h) return '';
  return `<a class="chip mono" data-goto="${esc(id)}" role="button" tabindex="0" title="${esc(h.t)}">${esc(id)} · ${ESTADOS[estadoDe(id)]}</a>`;
}

/* ---------- PLAN ---------- */
function renderPlan(){
  const pts = HU.reduce((a,h)=>a+h.pts,0);
  const hitos = D.hitos.map(h=>{
    const l=HU.filter(x=>x.h===h.id), ex=l.filter(x=>x.m).length;
    return `<div class="card hito"><div class="muted small mono">${h.id} · ${esc(h.nombre)}</div><div class="fecha">${esc(h.fecha)}</div>
      <p class="small">${esc(h.meta)}</p>${barra(l)}
      <p class="small muted">${ex?`${ex} HU exigidas por el PDF · `:''}${l.length-ex} complementarias</p>
      <button data-hito="${h.id}">Ver estas HU</button></div>`;}).join('');
  const plats = Object.keys(PL).map(p=>{const l=HU.filter(h=>h.pl===p);return `<div class="card"><div>${chipPl(p)}</div><div style="margin-top:8px">${barra(l)}</div></div>`}).join('');
  const dec = D.decisiones.slice().sort((a,b)=>(a.ok?1:0)-(b.ok?1:0)).map(d=>`<div class="card"><div class="line1"><span class="pill ${d.ok?'hecha':'dec'}">${d.ok?'Decidida':'Abierta'}</span> <span class="id">${d.id}</span> <b>${esc(d.t)}</b></div><p class="small muted" style="margin-top:6px">${esc(d.d)}</p><p class="small" style="margin-top:6px"><b>${esc(d.r)}</b></p></div>`).join('');
  $('#t-plan').innerHTML = `
    <div><h2>Un solo plan para las tres plataformas</h2>
    <p class="lead" style="margin-top:8px">Cada historia de usuario (HU) tiene su rol, sus criterios de aceptación, los endpoints que usa y la pantalla del Figma que le corresponde. Cualquiera puede tomar una HU libre y empezar. Lo que se tomó y lo que se terminó queda visible para todo el equipo.</p></div>
    <div class="card"><div class="stat">
      <div><b>${HU.length}</b><span>historias</span></div><div><b>${D.epicas.length}</b><span>épicas</span></div>
      <div><b>${pts}</b><span>puntos</span></div><div><b>${HU.filter(h=>estadoDe(h.id)==='hecha').length}</b><span>hechas</span></div>
      <div><b>${HU.filter(h=>estadoDe(h.id)==='libre').length}</b><span>libres</span></div></div></div>
    <div><h3 style="margin-bottom:10px">Hitos del cronograma</h3><div class="grid g5">${hitos}</div></div>
    <div class="grid g2">
      <div class="card"><h3>Cómo se trabaja una HU</h3><ol class="steps" style="margin-top:12px">
        <li><span>Entra a <b>Plataformas</b> o a <b>Backlog</b>, filtra por tu plataforma y toma la siguiente HU libre de la ruta (el número <i>Ruta #</i>).</span></li>
        <li><span>Pulsa <b>Tomar</b>. Queda con tu nombre y en <i>En curso</i>.</span></li>
        <li><span>Trabaja en tu rama de la semana, <code>&lt;plataforma&gt;-&lt;persona&gt;-s&lt;N&gt;</code> (por ejemplo <code>ios-kath-s2</code>), y empieza cada commit con el id de la HU. Detalle en Referencia.</span></li>
        <li><span>Cuando cumplas todos los criterios, cambia a <b>En revisión</b>. Otra persona la prueba y la marca <b>Hecha</b>.</span></li></ol></div>
      <div class="card"><h3>Cuándo una HU está hecha</h3><ul class="ticks" style="margin-top:8px">
        <li>Cumple todos sus criterios de aceptación, no solo el camino feliz.</li>
        <li>Se probó contra la API real, con un usuario del rol correcto.</li>
        <li>Maneja 401, 403, 409, 422 y 429 mostrando el mensaje de la API.</li>
        <li>Tiene estados vacío, cargando y error.</li>
        <li>No escribe tokens ni datos clínicos en logs.</li>
        <li>Coincide con el Figma, o el Figma se actualiza en el mismo PR.</li>
        <li>Otra persona del equipo la revisó.</li></ul></div></div>
    <div class="card"><h3>Para trabajar de corrido, sin esperar a nadie</h3><ul class="ticks" style="margin-top:8px">
      <li><b>Cada plataforma tiene su ruta numerada.</b> Quien termina una HU toma la siguiente libre; el orden ya respeta lo que depende de qué dentro de esa plataforma.</li>
      <li><b>Lo único que va antes de todo</b> es FUN-OPS-1, FUN-OPS-2 y FUN-OPS-3 (levantar la API, estructura del repositorio y configuración). Se hacen una sola vez, y después todas las plataformas avanzan en paralelo.</li>
      <li><b>La API ya existe.</b> Las apps no esperan a las HU de API; esas solo verifican y completan. Si falta un filtro, la app filtra por su cuenta mientras tanto.</li>
      <li><b>El Figma no bloquea.</b> Si la pantalla aún no está diseñada, se parte del frame de referencia o de la descripción de la pestaña App terminada, y se ajusta cuando el diseño llegue.</li>
      <li><b>Se apoya en, sin esperar</b> aparece en una HU cuando conviene mirar otra (un diseño o una HU de API), pero no hay que esperar a que termine.</li>
      <li>Los documentos (DOC) y las pruebas de integración (QA) sí van al final, porque describen lo que ya se construyó.</li></ul></div>
    <div><h3 style="margin-bottom:10px">Avance por plataforma</h3><div class="grid g3">${plats}</div></div>
    <div><h3 style="margin-bottom:10px">Decisiones</h3><div class="grid g2">${dec}</div></div>`;
}

/* ---------- SÁBADO ---------- */
function renderSabado(){

function filtrar(){
  const f=S.f, q=f.q.trim().toLowerCase();
  return HU.filter(h=>{
    if(f.ep&&h.ep!==f.ep) return false; if(f.pl&&h.pl!==f.pl) return false; if(f.h&&h.h!==f.h) return false;
    if(f.estado&&estadoDe(h.id)!==f.estado) return false;
    if(f.min&&!h.m) return false; if(f.libres&&estadoDe(h.id)!=='libre') return false;
    if(f.mios&&claim(h.id).dueno!==S.me) return false;
    if(q&&!(h.id+' '+h.t+' '+h.q+' '+h.api).toLowerCase().includes(q)) return false;
    return true;}).sort((a,b)=>(+a.h.slice(1))-(+b.h.slice(1))||(a.pl<b.pl?-1:a.pl>b.pl?1:0)||ORD[a.id]-ORD[b.id]);
}

/* ---------- vista ---------- */
function setTab(t, push){
  S.tab=t;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  document.querySelectorAll('section.panel').forEach(s=>s.classList.toggle('hidden',s.id!=='t-'+t));
  if(push){try{history.replaceState(null,'','#'+t)}catch(e){}}
  window.scrollTo({top:0});
}
function refreshAll(){
  if(document.activeElement && document.activeElement.tagName==='TEXTAREA' && S.tab==='backlog'){ S.pending=true; return; }
  S.pending=false;
  renderPlan(); renderSabado(); renderEntregas(); renderPlataformas(); renderFinal();
  if($('#f-list')) renderBacklogList(); else renderBacklogShell();
  renderReferencia();
  const w=$('#who'); w.textContent = S.me && S.names[S.me] ? 'Sesión: '+S.names[S.me] : (S.db?'':'Vista de solo lectura');
  const b=$('#banner');
  b.innerHTML = !S.db ? `<div class="callout info small">El seguimiento compartido (tomar y terminar HU) no está disponible en esta vista. Se puede leer todo el plan.</div>` :
    (S.canWrite===false ? `<div class="callout info small">Puedes ver quién trabaja en qué. Para tomar HU, pide acceso de colaborador al artefacto.</div>` : '');
}

/* ---------- eventos ---------- */
function irA(id){
  const h=BYID[id]; if(!h) return;
  S.f={q:'',ep:'',pl:'',h:'',estado:'',min:false,libres:false,mios:false}; S.open.add(id);
  setTab('backlog',true); renderBacklogShell();
  const el=document.querySelector('#t-backlog article.hu[data-id="'+id+'"]'); if(el) el.scrollIntoView({block:'center'});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-hito],[data-plat],[data-toggle],[data-goto],[data-act],#f-clear'); if(!t) return;
  if(t.dataset.tab){ setTab(t.dataset.tab,true); return; }
  if(t.dataset.hito){ S.f={q:'',ep:'',pl:'',h:t.dataset.hito,estado:'',min:false,libres:false,mios:false}; setTab('backlog',true); renderBacklogShell(); return; }
  if(t.dataset.plat){ S.plat=t.dataset.plat; renderPlataformas(); return; }
  if(t.dataset.goto){ irA(t.dataset.goto); return; }
  if(t.dataset.toggle){ const id=t.dataset.toggle; S.open.has(id)?S.open.delete(id):S.open.add(id);
    document.querySelectorAll('article.hu[data-id="'+id+'"]').forEach(a=>{a.outerHTML=huRow(BYID[id]);}); return; }
  if(t.id==='f-clear'){ S.f={q:'',ep:'',pl:'',h:'',estado:'',min:false,libres:false,mios:false}; renderBacklogShell(); return; }
  if(t.dataset.act==='tomar') escribir(t.dataset.id,'tomar');
  if(t.dataset.act==='soltar') escribir(t.dataset.id,'soltar');
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-goto]')){e.preventDefault();irA(e.target.dataset.goto);} });
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-q'){ S.f.q=t.value; renderBacklogList(); }
});
document.addEventListener('change',e=>{
  const t=e.target, m={ 'f-pl':'pl','f-ep':'ep','f-h':'h','f-estado':'estado' };
  if(m[t.id]){ S.f[m[t.id]]=t.value; renderBacklogList(); return; }
  if(t.id==='f-libres'||t.id==='f-min'||t.id==='f-mios'){ S.f[t.id.slice(2)]=t.checked; renderBacklogList(); return; }
  if(t.dataset.act==='estado') escribir(t.dataset.id,'estado',t.value);
});
document.addEventListener('focusout',e=>{
  const t=e.target;
  if(t.dataset && t.dataset.act==='nota'){ escribir(t.dataset.id,'nota',t.value).finally(()=>{ if(S.pending) refreshAll(); }); }
  else if(S.pending) setTimeout(()=>{ if(document.activeElement.tagName!=='TEXTAREA') refreshAll(); },0);
});

/* ---------- escritura compartida ---------- */
async function escribir(id,que,valor){
  if(!puedeEscribir()||S.busy.has(id)) return;
  const cur=claim(id), ref=S.db.doc('hu/'+id);
  let datos;
  if(que==='tomar'){ if(!S.me||estadoDe(id)!=='libre') return; datos={estado:'en_curso',dueno:S.me,nota:'',ts:Date.now()}; }
  else if(que==='estado'){ if(!puedeEditar(id)||cur.estado===valor) return; datos={...cur,estado:valor,ts:Date.now()}; }
  else if(que==='nota'){ if(!puedeEditar(id)||(cur.nota||'')===valor) return; datos={...cur,nota:valor.slice(0,500),ts:Date.now()}; }
  else if(que==='soltar'){ if(!puedeEditar(id)) return; }
  S.busy.add(id);
  try{ que==='soltar' ? await ref.delete() : await ref.set(datos); }
  catch(err){ const b=$('#banner'); b.innerHTML=`<div class="callout small">No se pudo guardar el cambio en ${esc(id)}${err&&err.code==='invalid_argument'?': tu acceso es de solo lectura.':'. Intenta de nuevo.'}</div>`; if(err&&err.code==='invalid_argument') S.canWrite=false; }
  finally{ S.busy.delete(id); }
}
async function cargarNombres(){
  const user=S.user; if(!user) return;
  const ids=[...new Set([...S.claims.values()].map(c=>c.dueno).concat(S.me).filter(Boolean))];
  if(!ids.length) return;
  const ps=await user.profiles(ids);
  let cambio=false; for(const id of ids){ const n=ps[id]&&ps[id].name; if(n&&S.names[id]!==n){S.names[id]=n;cambio=true;} }
  if(cambio) refreshAll();
}
async function iniciarDb(){
  if(!(window.claude&&window.claude.use)) return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db) return;
    S.db=db; S.user=user;
    if(user){ S.me=await user.id(); S.canWrite=await user.can('data.write'); S.canEdit=await user.canEdit(); }
    db.collection('hu').onSnapshot(snap=>{
      const m=new Map(); snap.docs.forEach(d=>{ if(d.exists) m.set(d.id,d.data()); });
      S.claims=m; S.live=true; refreshAll(); cargarNombres();
    },err=>{ if(err&&err.code==='revoked'){ S.db=null; refreshAll(); } });
    refreshAll();
  }catch(e){ S.db=null; refreshAll(); }
}

/* ---------- arranque ---------- */
renderBacklogShell();
refreshAll();
const inicial=(location.hash||'').slice(1);
setTab(['plan','sabado','entregas','plataformas','final','backlog','referencia'].includes(inicial)?inicial:'plan',false);
iniciarDb();
})();
</script>
